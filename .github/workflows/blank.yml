name: Build C OMAR POS V04

on:
  workflow_dispatch:
  push:
    paths:
      - 'C_OMAR_POS_v04_Source.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip C_OMAR_POS_v04_Source.zip -d project

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          fi
          test -n "$BUILD_FILE"
          gradle -p "$(dirname "$BUILD_FILE")" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: C-OMAR-POS-V04-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

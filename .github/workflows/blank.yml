name: Build C OMAR POS

on:
  workflow_dispatch:
  push:
    paths:
      - 'C_OMAR_POS_5_Devices_Source.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip C_OMAR_POS_5_Devices_Source.zip -d project

      - name: Build APK
        run: gradle -p project/C_OMAR_POS_5_Devices assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: C-OMAR-POS-APK
          path: project/C_OMAR_POS_5_Devices/app/build/outputs/apk/debug/app-debug.apk

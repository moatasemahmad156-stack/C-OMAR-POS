name: Build C OMAR POS V04 Signed

on:
  workflow_dispatch:
  push:
    paths:
      - 'C_OMAR_POS_v04_Source.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip C_OMAR_POS_v04_Source.zip -d project

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          fi
          test -n "$BUILD_FILE"
          gradle -p "$(dirname "$BUILD_FILE")" assembleDebug

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/c-omar.jks"
          APK=$(find project -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          mkdir -p signed
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/c-omar.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/C-OMAR-POS.apk "$APK"
          "$APKSIGNER" verify --print-certs signed/C-OMAR-POS.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: C-OMAR-POS-SIGNED-APK
          path: signed/*.apk
          if-no-files-found: error
